<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śpiewnik Organowy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #e5e5e5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAGŁÓWEK GŁÓWNY */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
    }

    .header-title {
      font-family: 'Cinzel', serif;
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 1px;
      line-height: 1.2;
      color: #ffffff;
    }

    .top-btn {
      background: #141414;
      border: 1px solid #262626;
      color: #d4d4d8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* NAWIGACJA GÓRNA (KARTY) */
    .nav-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      background-color: #0d0d0d;
      border-bottom: 1px solid #1a1a1a;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background-color: #1f1f23;
      color: #ffffff;
      font-weight: 500;
    }

    /* GŁÓWNA ZAWARTOŚĆ */
    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .section-view {
      display: none;
      height: 100%;
    }

    .section-view.active {
      display: flex;
      flex-direction: column;
    }

    /* PRZYCISKI DZIŚ / NIEDZIELA */
    .day-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sub-btn {
      flex: 1;
      padding: 10px;
      background-color: #121212;
      border: 1px solid #262626;
      color: #a1a1aa;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sub-btn.active {
      background-color: #f4f4f5;
      color: #09090b;
      border-color: #f4f4f5;
      font-weight: 600;
    }

    /* KONTENER NA CZYTANIA (WYCZYSZCZONY TEXT) */
    .readings-container {
      flex: 1;
      background-color: #121212;
      border: 1px solid #222222;
      border-radius: 8px;
      padding: 16px;
      overflow-y: auto;
      max-height: calc(100vh - 210px);
    }

    /* CZYSZCZENIE I FORMATOWANIE POBRANEGO HTML-A */
    .parsed-readings h1, 
    .parsed-readings h2, 
    .parsed-readings h3, 
    .parsed-readings h4 {
      font-family: 'Cinzel', serif;
      color: #f59e0b;
      margin: 18px 0 8px 0;
      font-size: 1.1rem;
    }

    .parsed-readings p {
      line-height: 1.6;
      font-size: 0.95rem;
      color: #d4d4d8;
      margin-bottom: 12px;
    }

    .parsed-readings strong {
      color: #ffffff;
    }

    .loading-box {
      text-align: center;
      padding: 40px 10px;
      color: #71717a;
      font-size: 0.9rem;
    }

    /* PASEK DOLNY (Dla zachowania pełnego wyglądu Twojej aplikacji) */
    footer {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #0a0a0a;
      border-top: 1px solid #1f1f1f;
      padding: 8px 0;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      color: #71717a;
      text-decoration: none;
      gap: 2px;
    }

    .footer-item.active {
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <!-- NAGŁÓWEK -->
  <header>
    <button class="top-btn" onclick="location.reload()">↺ Refresh</button>
    <div class="header-title">
      ŚPIEWNIK<br>ORGANOWY
    </div>
    <button class="top-btn">🔑 Zaloguj</button>
  </header>

  <!-- KARTY NAWIGACYJNE -->
  <nav class="nav-tabs">
    <button class="tab-btn" onclick="switchTab('glowna')">🏠 Główna</button>
    <button class="tab-btn" onclick="switchTab('baza')">🎼 Baza</button>
    <button class="tab-btn" onclick="switchTab('repertuar')">📋 Repertuar (0)</button>
    <button class="tab-btn active" id="tabCzytania" onclick="switchTab('czytania')">📖 Czytania</button>
  </nav>

  <!-- TREŚĆ GŁÓWNA -->
  <main>

    <!-- WIDOK: GŁÓWNA (PLACEHOLDER) -->
    <div id="viewGlowna" class="section-view">
      <div style="padding:20px; text-align:center; color:#666;">Widok Główny</div>
    </div>

    <!-- WIDOK: BAZA (PLACEHOLDER) -->
    <div id="viewBaza" class="section-view">
      <div style="padding:20px; text-align:center; color:#666;">Baza Pieśni</div>
    </div>

    <!-- WIDOK: REPERTUAR (PLACEHOLDER) -->
    <div id="viewRepertuar" class="section-view">
      <div style="padding:20px; text-align:center; color:#666;">Twój Repertuar</div>
    </div>

    <!-- WIDOK: CZYTANIA (WERSJA I - DOMPARSER) -->
    <div id="viewCzytania" class="section-view active">
      <div class="day-selector">
        <button class="sub-btn active" id="btnCzytaniaDzis" onclick="loadReadings('dzis')">📅 Dzisiejsze Czytania</button>
        <button class="sub-btn" id="btnCzytaniaNiedziela" onclick="loadReadings('niedziela')">⛪ Najbliższa Niedziela</button>
      </div>

      <div class="readings-container" id="readingsContainer">
        <div id="readingsContent" class="loading-box">Wybierz dzień, aby pobrać czytania...</div>
      </div>
    </div>

  </main>

  <!-- PASEK DOLNY -->
  <footer>
    <a href="#" class="footer-item">
      <span>🐟</span>
      <span>NIEZBĘDNIK KATOLIKA</span>
    </a>
    <a href="#" class="footer-item">
      <span>☰</span>
      <span>Menu</span>
    </a>
    <a href="#" class="footer-item active">
      <span>📖</span>
      <span>Liturgia</span>
    </a>
    <a href="#" class="footer-item">
      <span>🪙</span>
      <span>Wspieram</span>
    </a>
    <a href="#" class="footer-item">
      <span>🇳</span>
      <span>niedziela.pl</span>
    </a>
  </footer>

  <script>
    // PRZEŁĄCZANIE KART GŁÓWNYCH
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section-view').forEach(view => view.classList.remove('active'));

      if (tabName === 'glowna') document.getElementById('viewGlowna').classList.add('active');
      if (tabName === 'baza') document.getElementById('viewBaza').classList.add('active');
      if (tabName === 'repertuar') document.getElementById('viewRepertuar').classList.add('active');
      if (tabName === 'czytania') {
        document.getElementById('viewCzytania').classList.add('active');
        document.getElementById('tabCzytania').classList.add('active');
      }
    }

    // POBIERANIE I PARSOWANIE CZYTAŃ (WERSJA I)
    async function loadReadings(type) {
      const container = document.getElementById('readingsContent');
      const btnDzis = document.getElementById('btnCzytaniaDzis');
      const btnNiedziela = document.getElementById('btnCzytaniaNiedziela');

      // Obsługa aktywnego przycisku
      if (type === 'dzis') {
        btnDzis.classList.add('active');
        btnNiedziela.classList.remove('active');
      } else {
        btnNiedziela.classList.add('active');
        btnDzis.classList.remove('active');
      }

      // Wyliczanie daty
      let targetDate = new Date();
      if (type === 'niedziela') {
        const dayOfWeek = targetDate.getDay();
        const daysUntilSunday = dayOfWeek === 0 ? 0 : (7 - dayOfWeek);
        targetDate.setDate(targetDate.getDate() + daysUntilSunday);
      }

      const yyyy = targetDate.getFullYear();
      const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
      const dd = String(targetDate.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;

      const targetUrl = `https://niezbednik.niedziela.pl/liturgia/${dateStr}`;
      
      container.innerHTML = `<div class="loading-box">Pobieranie i oczyszczanie tekstów na ${dateStr}...</div>`;

      try {
        // Pobranie danych przez serwer CORS Proxy
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (!data.contents) throw new Error("Brak zawartości ze strony");

        // Parsowanie kodu HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // Odnajdywanie kontenera z czytaniami
        const mainContent = doc.querySelector('.liturgia-content') || doc.querySelector('#content') || doc.querySelector('main');

        if (mainContent) {
          // Wycinanie reklam, bannerów, nawigacji, odnośników społecznościowych i zbędnych skryptów
          const unwantedSelectors = [
            'script', 'iframe', 'style', 'nav', 'footer', 
            '.ads', '.banner', '.share-buttons', '.sidebar', 
            '#header', '#footer', '.bottom-menu'
          ];
          
          unwantedSelectors.forEach(selector => {
            mainContent.querySelectorAll(selector).forEach(el => el.remove());
          });

          // Wstawianie przefiltrowanego tekstu do aplikacji
          container.innerHTML = `
            <h3 style="font-family:'Cinzel',serif; color:#fff; text-align:center; margin-bottom:16px;">Liturgia Słowa: ${dateStr}</h3>
            <div class="parsed-readings">${mainContent.innerHTML}</div>
          `;
        } else {
          throw new Error("Nie znaleziono sekcji z liturgia.");
        }

      } catch (err) {
        console.error("Błąd parsowania:", err);
        container.innerHTML = `
          <div style="text-align:center; padding: 20px;">
            <p style="color:#ef4444; margin-bottom:12px;">Nie udało się automatycznie wyciąć treści.</p>
            <a href="${targetUrl}" target="_blank" style="color:#f59e0b; text-decoration:underline; font-size:0.9rem;">
              Otwórz czytania bezpośrednio na stronie źródłowej
            </a>
          </div>
        `;
      }
    }

    // Załaduj dzisiejsze czytania automatycznie przy wystarcie
    loadReadings('dzis');
  </script>
</body>
</html>
