<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Śpiewnik Organowy</title>

  <!-- Cache-Control Meta Tags (wymuszanie braku keszowania w przeglądarce) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts - Dostojny liturgiczny charakter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 32px;
    }

    /* Heavy Sacred Header */
    header {
      position: sticky;
      top: 0;
      background-color: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(8px);
      padding-top: 8px;
      padding-bottom: 12px;
      z-index: 20;
      border-bottom: 1px solid #262626;
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f5f5f5;
      text-transform: uppercase;
      flex: 1;
      text-align: center;
    }

    .refresh-btn {
      background-color: #171717;
      border: 1px solid #333333;
      color: #e5e5e5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .refresh-btn:active {
      background-color: #262626;
      transform: scale(0.95);
    }

    /* Wyszukiwarka */
    .search-container {
      margin-bottom: 12px;
    }
    .search-bar {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #333333;
      background-color: #141414;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-bar:focus {
      border-color: #d4d4d4;
      box-shadow: 0 0 0 1px #d4d4d4;
    }

    /* Kategorie - Pasek filtrów */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background-color: #171717;
      color: #a3a3a3;
      border: 1px solid #262626;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-btn.active {
      background-color: #f5f5f5;
      color: #0a0a0a;
      border-color: #ffffff;
      font-weight: 600;
    }

    /* Grid z kartami */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    @media (min-width: 600px) {
      .song-grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 18px;
      }
    }

    /* Karty pieśni */
    .song-card {
      background-color: #141414;
      border: 1px solid #262626;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }
    .song-card:hover {
      border-color: #525252;
    }
    .song-card:active {
      transform: scale(0.98);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
      background-color: #000000;
      overflow: hidden;
    }
    .song-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(20%);
      transition: filter 0.2s;
    }
    .song-card:hover img {
      filter: grayscale(0%);
    }

    /* Odznaki na karcie */
    .slide-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: rgba(10, 10, 10, 0.88);
      border: 1px solid #404040;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .song-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      justify-content: space-between;
    }
    .song-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #f5f5f5;
      line-height: 1.35;
      word-break: break-word;
    }
    .song-category {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #737373;
      font-weight: 500;
    }

    /* Modal / Viewer Nut */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 100;
      flex-direction: column;
    }
    .modal.active {
      display: flex;
    }

    .modal-header {
      padding: 16px 20px;
      background-color: #0a0a0a;
      border-bottom: 1px solid #262626;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 80%;
    }
    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .modal-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
    }
    .meta-tag {
      background-color: #1f1f1f;
      border: 1px solid #333333;
      color: #a3a3a3;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .meta-slide {
      color: #e5e5e5;
      font-weight: 600;
    }

    .close-btn {
      background: #171717;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .close-btn:active {
      background-color: #262626;
    }

    .modal-body {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background-color: #050505;
    }
    .modal-body img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background-color: #ffffff;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    /* Stany ładowania */
    .status-msg {
      text-align: center;
      padding: 60px 16px;
      color: #737373;
      font-size: 0.95rem;
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }
    .error-msg {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Nuty Organowe</h1>
      <button class="refresh-btn" onclick="forceRefresh()">↻ Odśwież</button>
    </div>
    
    <div class="search-container">
      <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj pieśni lub numeru slajdu..." />
    </div>

    <!-- Pasek Filtrowania Kategorii -->
    <div class="categories-bar" id="categoriesBar">
      <button class="cat-btn active" onclick="filterCategory('Wszystkie')">Wszystkie</button>
      <button class="cat-btn" onclick="filterCategory('Adwent')">Adwent</button>
      <button class="cat-btn" onclick="filterCategory('Boże Narodzenie')">Boże Narodzenie</button>
      <button class="cat-btn" onclick="filterCategory('Wielki Post')">Wielki Post</button>
      <button class="cat-btn" onclick="filterCategory('Wielkanoc')">Wielkanoc</button>
      <button class="cat-btn" onclick="filterCategory('Maryjne')">Maryjne</button>
      <button class="cat-btn" onclick="filterCategory('Ogólne')">Ogólne / Inne</button>
    </div>
  </header>

  <main>
    <div id="status" class="status-msg">Ładowanie śpiewnika...</div>
    <div id="songGrid" class="song-grid"></div>
  </main>

  <!-- Pełny Widok Utworu -->
  <div id="imageModal" class="modal">
    <div class="modal-header">
      <div class="modal-header-info">
        <div id="modalTitle" class="modal-title"></div>
        <div class="modal-meta">
          <span id="modalCategory" class="meta-tag"></span>
          <span id="modalSlide" class="meta-slide"></span>
        </div>
      </div>
      <button class="close-btn" onclick="closeModal()">Zamknij ✕</button>
    </div>
    <div class="modal-body">
      <img id="modalImage" src="" alt="Nuty" />
    </div>
  </div>

  <script>
    // --- KONFIGURACJA GOOGLE DRIVE API ---
    const FOLDER_ID = '1W-9DISbSkwwwOUBXmiBIgcIKbdZqIHA-';
    const API_KEY = 'AIzaSyDM3V9xJhY4AO2V3MaFN6MZIufi0OqGOCk';

    let allSongs = [];
    let currentCategory = 'Wszystkie';

    async function loadSongs() {
      const statusEl = document.getElementById('status');

      // Unikalny timestamp chroniący przed zapamiętywaniem starej listy przez przeglądarkę
      const cacheBuster = `&_cb=${Date.now()}`;
      const query = `'${FOLDER_ID}' in parents and trashed = false and (mimeType contains 'image/')`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,thumbnailLink)&pageSize=500&key=${API_KEY}${cacheBuster}`;

      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `Błąd HTTP: ${response.status}`);
        }

        const data = await response.json();
        const files = data.files || [];

        if (files.length === 0) {
          statusEl.innerText = 'Nie znaleziono nut w tym folderze.';
          return;
        }

        allSongs = files.map(file => parseFileData(file));
        allSongs.sort((a, b) => a.cleanTitle.localeCompare(b.cleanTitle, 'pl'));

        statusEl.style.display = 'none';
        renderSongs();
      } catch (err) {
        console.error('API Error:', err);
        statusEl.className = 'status-msg error-msg';
        statusEl.innerText = `Błąd pobierania: ${err.message}`;
      }
    }

    function parseFileData(file) {
      let rawName = file.name.replace(/\.(jpg|jpeg|png|webp)$/i, '').trim();

      let slideNum = null;
      const slideMatch = rawName.match(/\((\d+)\)/) || rawName.match(/[-_]\s*(\d+)$/);
      if (slideMatch) {
        slideNum = slideMatch[1];
        rawName = rawName.replace(slideMatch[0], '').trim();
      }

      let category = 'Ogólne';
      const lower = file.name.toLowerCase();

      if (lower.includes('adwent')) category = 'Adwent';
      else if (lower.includes('kolęd') || lower.includes('boże narodzenie') || lower.includes('narodzen')) category = 'Boże Narodzenie';
      else if (lower.includes('post') || lower.includes('krzyż')) category = 'Wielki Post';
      else if (lower.includes('wielkanoc') || lower.includes('zmartwych')) category = 'Wielkanoc';
      else if (lower.includes('maryj') || lower.includes('panna')) category = 'Maryjne';

      return {
        id: file.id,
        cleanTitle: rawName,
        slideNumber: slideNum,
        category: category,
        rawName: file.name
      };
    }

    function renderSongs() {
      const gridEl = document.getElementById('songGrid');
      gridEl.innerHTML = '';

      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allSongs.filter(song => {
        const matchesCategory = (currentCategory === 'Wszystkie') || (song.category === currentCategory);
        const matchesSearch = song.cleanTitle.toLowerCase().includes(searchTerm) || 
                              (song.slideNumber && song.slideNumber.includes(searchTerm)) ||
                              song.category.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        gridEl.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#525252;">Brak pieśni spełniających kryteria.</div>';
        return;
      }

      const timestamp = Date.now();
      filtered.forEach(song => {
        const thumbUrl = `https://lh3.googleusercontent.com/d/${song.id}=s400?v=${timestamp}`;
        const fullUrl = `https://lh3.googleusercontent.com/d/${song.id}=s2000?v=${timestamp}`;

        const card = document.createElement('div');
        card.className = 'song-card';
        card.onclick = () => openModal(song, fullUrl);

        const slideBadgeHTML = song.slideNumber ? `<div class="slide-badge">Slajd #${song.slideNumber}</div>` : '';

        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${thumbUrl}" alt="${song.cleanTitle}" loading="lazy" />
            ${slideBadgeHTML}
          </div>
          <div class="song-info">
            <div class="song-title">${song.cleanTitle}</div>
            <div class="song-category">${song.category}</div>
          </div>
        `;

        gridEl.appendChild(card);
      });
    }

    function filterCategory(catName) {
      currentCategory = catName;

      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.innerText.includes(catName) || (catName === 'Ogólne' && btn.innerText.includes('Ogólne'))) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderSongs();
    }

    function openModal(song, imageUrl) {
      document.getElementById('modalTitle').innerText = song.cleanTitle;
      document.getElementById('modalCategory').innerText = song.category;
      document.getElementById('modalSlide').innerText = song.slideNumber ? `Slajd #${song.slideNumber}` : '';
      
      document.getElementById('modalImage').src = imageUrl;
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
      document.getElementById('modalImage').src = '';
    }

    function forceRefresh() {
      document.getElementById('status').style.display = 'block';
      document.getElementById('status').innerText = 'Odświeżanie z Google Drive...';
      document.getElementById('songGrid').innerHTML = '';
      loadSongs();
    }

    document.getElementById('searchInput').addEventListener('input', renderSongs);

    // --- REJESTRACJA SERVICE WORKERA Z OBSŁUGĄ STRATEGII NETWORK-FIRST ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js?v=' + Date.now()).then(reg => {
        reg.update();
      }).catch(err => console.log('SW error:', err));
    }

    loadSongs();
  </script>
</body>
</html>
