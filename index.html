<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Śpiewnik - Nuty Organowe</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      min-height: 100vh;
    }
    
    /* Header / Search */
    header {
      position: sticky;
      top: 0;
      background-color: #0f172a;
      padding-bottom: 12px;
      z-index: 10;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #38bdf8;
      text-align: center;
    }
    .search-container {
      position: relative;
    }
    .search-bar {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      outline: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .search-bar:focus {
      border-color: #38bdf8;
    }

    /* Grid z plikami */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    @media (min-width: 600px) {
      .song-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
    }

    /* Karty pieśni */
    .song-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .song-card:active {
      transform: scale(0.97);
    }
    .song-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #0284c710;
    }
    .song-title {
      padding: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #e2e8f0;
      line-height: 1.3;
      text-align: center;
      word-break: break-word;
    }

    /* Fullscreen Modal / Viewer */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 100;
      flex-direction: column;
    }
    .modal.active {
      display: flex;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #1e293b;
    }
    .modal-title {
      font-size: 1rem;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .close-btn {
      background: none;
      border: none;
      color: #38bdf8;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-body {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }
    .modal-body img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Stany ładowania i błędów */
    .status-msg {
      text-align: center;
      padding: 40px 16px;
      color: #94a3b8;
      font-size: 1rem;
    }
    .error-msg {
      color: #f87171;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nuty Organowe</h1>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj pieśni..." />
    </div>
  </header>

  <main>
    <div id="status" class="status-msg">Pobieranie listy nut z Google Drive...</div>
    <div id="songGrid" class="song-grid"></div>
  </main>

  <!-- Fullscreen Image Viewer -->
  <div id="imageModal" class="modal">
    <div class="modal-header">
      <span id="modalTitle" class="modal-title"></span>
      <button class="close-btn" onclick="closeModal()">Zamknij ✕</button>
    </div>
    <div class="modal-body">
      <img id="modalImage" src="" alt="Nuty" />
    </div>
  </div>

  <script>
    // --- KONFIGURACJA API ---
    const FOLDER_ID = '1W-9DISbSkwwwOUBXmiBIgcIKbdZqIHA-';
    
    // Wklej tutaj swój wygenerowany w Google Cloud API Key
    const API_KEY = 'TWÓJ_KLUCZ_GOOGLE_API_KEY';

    let allSongs = [];

    async function loadSongs() {
      const statusEl = document.getElementById('status');

      if (API_KEY === 'TWÓJ_KLUCZ_GOOGLE_API_KEY') {
        statusEl.className = 'status-msg error-msg';
        statusEl.innerHTML = 'Uzupełnij <b>API_KEY</b> w pliku index.html!';
        return;
      }

      // Query: pliki z danego folderu, nie usunięte (trashed = false), typu image/jpeg, image/png
      const query = `'${FOLDER_ID}' in parents and trashed = false and (mimeType contains 'image/')`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,thumbnailLink)&pageSize=500&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `Błąd HTTP: ${response.status}`);
        }

        const data = await response.json();
        allSongs = data.files || [];

        if (allSongs.length === 0) {
          statusEl.innerText = 'Nie znaleziono obrazów JPG/PNG w wskazanym folderze.';
          return;
        }

        // Sortowanie alfabetyczne po nazwie pliku
        allSongs.sort((a, b) => a.name.localeCompare(b.name, 'pl'));

        statusEl.style.display = 'none';
        renderSongs(allSongs);
      } catch (err) {
        console.error('Google Drive API Error:', err);
        statusEl.className = 'status-msg error-msg';
        statusEl.innerText = `Błąd ładowania: ${err.message}`;
      }
    }

    function renderSongs(songs) {
      const gridEl = document.getElementById('songGrid');
      gridEl.innerHTML = '';

      songs.forEach(song => {
        // Obraz podglądu bezpośrednio z Google
        const thumbUrl = `https://lh3.googleusercontent.com/d/${song.id}=s400`;
        const fullUrl = `https://lh3.googleusercontent.com/d/${song.id}=s2000`;

        const card = document.createElement('div');
        card.className = 'song-card';
        card.onclick = () => openModal(song.name, fullUrl);

        card.innerHTML = `
          <img src="${thumbUrl}" alt="${song.name}" loading="lazy" />
          <div class="song-title">${cleanTitle(song.name)}</div>
        `;

        gridEl.appendChild(card);
      });
    }

    // Usuwa rozszerzenia typu .jpg/.png z nazwy do czystego wyświetlania
    function cleanTitle(filename) {
      return filename.replace(/\.(jpg|jpeg|png|webp)$/i, '');
    }

    // Modal Viewer
    function openModal(title, imageUrl) {
      document.getElementById('modalTitle').innerText = cleanTitle(title);
      document.getElementById('modalImage').src = imageUrl;
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
      document.getElementById('modalImage').src = '';
    }

    // Wyszukiwarka
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allSongs.filter(s => s.name.toLowerCase().includes(term));
      renderSongs(filtered);
    });

    // Rejestracja Service Workera dla PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
    }

    // Start
    loadSongs();
  </script>
</body>
</html>
